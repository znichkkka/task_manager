<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ task.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ task.title }}</h1>
    <p><a href="{{ url_for('index') }}">К списку задач</a></p>
    <div>
        <p>Категория: {{ task.category_name }}</p>
        <p>Приоритет: {{ task.priority_name }}</p>
        <p>Статус: {{ task.status_name }}</p>
        <h2>Описание: </h2>
        <p class="description">{{ task.description }}</p>
        <p><a href="{{ url_for('edit', task_id=task.id) }}">Редактировать</a></p>
        <form action="{{ url_for('delete', task_id=task.id) }}" method="post">
            <button type="submit">Удалить задачу</button>
        </form>
    </div>
</body>
</html>
